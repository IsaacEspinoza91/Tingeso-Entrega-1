version: "3.8"
services:
  # Nginx servers
  nginx-backend:
    image: nginx
    container_name: karting-nginx-backend-container
    restart: always #Ante cualquier problema, se reinicia
    ports:
      - 80:80 #p externo:interno
    volumes:
      - ./backend.conf:/etc/nginx/nginx.conf # copia el archivo backend.conf y loc copia en el cotenedor
    networks:
      - karting-backend-network
    depends_on:
      - spring1
      - spring2
      - spring3

  nginx-frontend:
    image: nginx
    container_name: karting-nginx-frontend-container
    restart: always
    ports:
      - 8070:8070
    volumes:
      - ./frontend.conf:/etc/nginx/nginx.conf
    networks:
      - karting-frontend-network
    depends_on:
      - react1
      - react2
      - react3

  postgres:
    container_name: karting-postgres-container
    image: postgres
    deploy:
      restart_policy:
        condition: on-failure # Reinicio ante errores
    volumes:
      - karting-postgres-volume:/var/lib/postgresql/data
    networks:
      - karting-backend-network
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - 5435:5432

  spring1:
    container_name: karting-backend-container-1
    image: isaaccumbia/karting-backend:latest
    ports:
      - 8091:8090 # Solo cambia puerto externo
    environment:
      DB_HOST: karting-postgres-container
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    networks:
      - karting-backend-network
    deploy:
      restart_policy:
        condition: on-failure
    depends_on:
      - postgres

  spring2:
    container_name: karting-backend-container-2
    image: isaaccumbia/karting-backend:latest
    ports:
      - 8092:8090
    environment:
      DB_HOST: karting-postgres-container
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    networks:
      - karting-backend-network
    deploy:
      restart_policy:
        condition: on-failure
    depends_on:
      - postgres

  spring3:
    container_name: karting-backend-container-3
    image: isaaccumbia/karting-backend:latest
    ports:
      - 8093:8090
    environment:
      DB_HOST: karting-postgres-container
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    networks:
      - karting-backend-network
    deploy:
      restart_policy:
        condition: on-failure

  react1:
    container_name: karting-frontend-container-1
    image: isaaccumbia/karting-frontend:latest
    ports:
      - 3001:3000
    networks:
      - karting-frontend-network
    deploy:
      restart_policy:
        condition: on-failure

  react2:
    container_name: karting-frontend-container-2
    image: isaaccumbia/karting-frontend:latest
    ports:
      - 3002:3000
    networks:
      - karting-frontend-network
    deploy:
      restart_policy:
        condition: on-failure

  react3:
    container_name: karting-frontend-container-3
    image: isaaccumbia/karting-frontend:latest
    networks:
      - karting-frontend-network
    ports:
      - 3003:3000
    deploy:
      restart_policy:
        condition: on-failure
volumes:
  karting-postgres-volume:
networks:
  karting-frontend-network:
  karting-backend-network:
