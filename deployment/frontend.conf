events {
    worker_connections  1024;
}

http {
    upstream karting-frontend {
        server karting-frontend-container-1:3000;
        server karting-frontend-container-2:3000;
        server karting-frontend-container-3:3000;
    }

    server {
        listen 8070;
        charset utf-8;
        access_log off;

        location / {
            proxy_pass http://karting-frontend;
        } 
    }
}